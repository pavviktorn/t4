[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ffaa"
version = "0.1.0"
description = "Multimodal Large Language Model based Explainable Open-World Face Forgery Analysis Assistant."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch>=2.4", "torchvision>=0.19",
    "transformers==5.8.0", "tokenizers>=0.22.0,<=0.23.0", "sentencepiece!=0.1.92,>=0.1.91", "shortuuid",
    "accelerate>=1.1.0", "peft", "bitsandbytes",
    "pydantic", "markdown2[all]", "numpy", "scikit-learn==1.3.2",
    "gradio==4.16.0", "gradio_client==0.8.1",
    "requests", "httpx==0.24.0", "uvicorn", "fastapi",
    "einops==0.6.1", "einops-exts==0.0.4", "timm==0.6.13",
    "albumentations==1.4.11", "dlib==19.24.6", "grad_cam==1.5.2",
    "safetensors>=0.4.3", "huggingface-hub>=1.5.0,<2.0", "opencv_python_headless==4.10.0.84", 
    "pillow==10.4.0",
]

[project.optional-dependencies]
train = ["deepspeed==0.12.6", "flash_attn==2.5.8", "ninja", "wandb"]
build = ["build", "twine"]

[project.urls]
"Homepage" = "https://ffaa-vl.github.io/"
"Bug Tracker" = "https://github.com/thu-huangzc/FFAA/issues"

[tool.setuptools.packages.find]
exclude = ["benchmark*", "checkpoints*", "docs", "experiments", "heatmaps*", "playground*", "scripts*"]

[tool.wheel]
exclude = ["benchmark*", "checkpoints*", "docs", "experiments", "heatmaps*", "playground*", "scripts*"]
